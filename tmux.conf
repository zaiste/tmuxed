# vim: fdm=marker

# I N T R O 
#
# - set is the alias of set-option
# - set infers window options from their name, so setw is not needed
#

set -g mode-keys vi
set -g copy-mode-line-numbers hybrid
set -g pane-scrollbars modal

# Setup {{{

unbind C-b
set -g prefix C-a

# }}}

bind r source-file ~/.tmux.conf \; display '~/.tmux.conf reloaded'

# General {{{

set -g set-titles on
# truecolor even when COLORTERM is not forwarded, e.g. over SSH
set -sa terminal-features ',xterm*:RGB'

# }}}


# Windows & Panes {{{

# windows numbers start at 1
set -g base-index 1

set -g renumber-windows on

bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# split panes, vertically using | and horizontally useing -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

bind Tab last-window

# watch the current window for activity
bind A set monitor-activity \; display 'monitor-activity #{?monitor-activity,on,off}'

# }}}


bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

bind a send-prefix

set -g bell-action none

set -g clock-mode-colour colour135

set -g message-command-style fg=blue,bg=black,fill=black
set -g message-style fg=colour232,bg=colour4,fill=colour4

set -g mode-style bg=colour195,fg=black

set -g set-titles-string '#{user} :: #h'

set -g status-interval 2
set -g status-style bg=black
# tell remote sessions apart from local ones
%if #{SSH_CONNECTION}
set -g status-style bg=colour52
%endif
set -g status-left ""
set -g status-left-length 40
set -g status-right '#[fg=colour67]1.1.1.1 #[fg=white,bg=colour241] %d/%m #[fg=colour233,bold,bg=colour245] %H:%M:%S '
#set -g status-right '#[fg=colour67]#(curl ipecho.net/plain;echo) #[fg=white,bg=colour241] %d/%m #[fg=colour233,bold,bg=colour245] %H:%M:%S '
set -g status-right-length 50

set -g window-status-format ' #W:#I '
set -g window-status-current-format ' #W:#I '
set -g window-status-current-style fg=white,bold,bg=colour63
set -g window-status-style fg=colour63,bg=black,bold
set -g window-status-bell-style bold,fg=colour255,bg=colour1

set -g visual-activity on

set -g pane-border-style fg=black,bg=colour235
set -g pane-active-border-style bg=colour236,fg=colour51



